[package]
name = "obscur-tor-gateway"
version = "0.1.0"
edition = "2021"
description = "R4: separate OS process that owns tor.exe lifecycle (UI must never spawn Tor)"
publish = false

[lib]
name = "obscur_tor_gateway"
path = "src/lib.rs"

[[bin]]
name = "obscur-tor-gateway"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-socks = "0.5.2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
  "socks",
] }
