[[permission]]
identifier = "allow-db-commands"
description = "Native SQLite persistence commands"
commands.allow = [
    "db_insert_message",
    # Slice 15 — DM read IPC tombstoned; product uses engine_invoke
    # dm.getThread / dm.listConversations (Slices 6–14).
    # @see specs/backend/r-dm-read-tombstone-slice15-design-2026-07.md
    # Slice 21 — DM delete/tombstone IPC tombstoned; product uses engine_invoke
    # dm.deleteMessages / insertTombstone / listTombstones / deleteAllTombstones (Slice 20).
    # @see specs/backend/r-dm-delete-tombstone-ipc-slice21-design-2026-07.md
    "db_upsert_conversation",
    # Group list/message/tombstone IPC tombstoned; product uses engine_invoke
    # workspace.listGroups / upsertGroup / listGroupMessages / insertGroupMessage /
    # insertGroupTombstone (U2 + community-group-db-ipc-tombstone).
    # @see specs/backend/community-group-db-ipc-tombstone-design-2026-07.md
    # Slice 19 — call-record IPC tombstoned; product uses engine_invoke
    # persistence.listCallRecords / upsertCallRecord (Slice 18).
    # @see specs/backend/r-call-ipc-tombstone-slice19-design-2026-07.md
    # Slice 10 — ACC-03 checkpoint IPC quarantined; product uses engine_invoke
    # transport.listRelayCheckpoints / upsertRelayCheckpoint (Slices 8–9).
    # @see specs/backend/r-transport-checkpoint-acl-slice10-design-2026-07.md
    # Slice 23 — search/wipe IPC tombstoned; product uses engine_invoke
    # persistence.searchMessages / wipeProfileLocalData (Slice 22).
    # @see specs/backend/r-search-wipe-ipc-tombstone-slice23-design-2026-07.md
    "engine_invoke",
    "engine_invoke_transport_publish_relay_event",
    "engine_invoke_transport_configure_mesh_conduits",
    "engine_invoke_transport_get_mesh_snapshot",
    "engine_invoke_transport_publish_mesh_envelope",
    "engine_invoke_transport_export_offline_pack",
    "engine_invoke_transport_import_offline_pack"
]

